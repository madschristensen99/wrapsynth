[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
wrapsynth = "EFRLChkEz8nDmkZs9n4ZUYazcN7E1QytKNDmtYm4vxEF"
wrapsynth_vault_manager = "EZ1hsgYwmqmCY5Gzw9mwnJnJE4PJcKX5hHw5MZXk2ssy"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/vault_manager.ts"
test-oracle = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/oracle_dual_source.test.ts"

[test]
startup_wait = 15000

