[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
wrapsynth_vault_manager = "C9kVasKgQiUX1BCngBjorvMA8QaFyERHvdkYdwPyy3H1"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx tsc -p tsconfig.test.json && npx mocha -t 1000000 dist-test/tests/vault_manager.js"

[test]
startup_wait = 15000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "http://localhost:8899"
ledger = ".anchor/test-ledger"
rpc_port = 8899
