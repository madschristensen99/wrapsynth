[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
cache_path = "cache_forge"
solc_version = "0.8.28"
evm_version = "cancun"

# Optimizer settings
optimizer = true
optimizer_runs = 200
via_ir = true

# Enable FFI for fetching real prices in E2E tests
ffi = true

# Allow deploy scripts to write the manifest to ./deployments
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# RPC endpoints
[rpc_endpoints]
gnosis = "${GNOSIS_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
bnb = "${BNB_RPC_URL}"
base = "${BASE_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

# Etherscan API keys for verification
[etherscan]
gnosis = { key = "${GNOSISSCAN_API_KEY}", url = "https://api.gnosisscan.io/api" }
bnb = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
# robinhood: robin.etherscan.io is Etherscan V2 — forge can't resolve chain 4663,
# so verify by submitting standard-JSON input to api.etherscan.io/v2/api?chainid=4663
# directly (see verification steps in README).

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
