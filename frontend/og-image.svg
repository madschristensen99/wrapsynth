<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c14"/>
      <stop offset="100%" stop-color="#161621"/>
    </linearGradient>
    <radialGradient id="glow1" cx="35%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#3efce0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3efce0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#3efce0"/>
    </linearGradient>
    <linearGradient id="ctaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a4d"/>
      <stop offset="100%" stop-color="#ff7a3d"/>
    </linearGradient>
    <filter id="markGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ctaGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Gradient mark (logo will be composited on top later) -->
  <rect x="565" y="90" width="70" height="70" rx="18" fill="url(#mark)" filter="url(#markGlow)"/>

  <text x="600" y="280" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.035em">Bring <tspan fill="#ff7a3d">Monero</tspan> to <tspan fill="#3efce0">DeFi</tspan></text>

  <text x="600" y="335" font-family="'Inter', sans-serif" font-size="26" font-weight="400" fill="#a8a8c0" text-anchor="middle">Trustless wrapped Monero via atomic liquidity</text>

  <rect x="470" y="390" width="260" height="56" rx="14" fill="url(#ctaBg)" filter="url(#ctaGlow)"/>
  <text x="600" y="427" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#160a02" text-anchor="middle">Launch app  →</text>

  <text x="600" y="510" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#ff7a3d" text-anchor="middle" letter-spacing="-0.01em">&gt;200%</text>
  <text x="600" y="535" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#686880" text-anchor="middle">Overcollateralized</text>

  <text x="430" y="510" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">24h</text>
  <text x="430" y="535" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#686880" text-anchor="middle">Swap timeout</text>

  <text x="770" y="510" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#3efce0" text-anchor="middle">wsXMR</text>
  <text x="770" y="535" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#686880" text-anchor="middle">On Gnosis Chain</text>

  <line x1="515" y1="495" x2="515" y2="540" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="685" y1="495" x2="685" y2="540" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
</svg>